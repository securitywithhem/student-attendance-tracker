<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Attendance Tracker</title>
    <meta name="description" content="Student Attendance Tracker — mark and view attendance" />
    <link rel="stylesheet" href="/css/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f766e'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <header class="topbar" id="topbar" hidden>
      <a class="brand" href="#/">
        <span class="brand-mark" aria-hidden="true">✓</span>
        <span>Attendance Tracker</span>
      </a>
      <div class="topbar-user">
        <span class="user-name" id="user-name"></span>
        <span class="role-chip" id="user-role"></span>
        <button class="btn btn-ghost" id="logout-btn" type="button">Log out</button>
      </div>
    </header>

    <main id="app" class="page" aria-live="polite"></main>

    <div class="toast" id="toast" role="status" hidden></div>

    <script src="/js/api.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/views/login.js"></script>
    <script src="/js/views/faculty.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
